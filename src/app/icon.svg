<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    Three measured values of unequal magnitude, separated by the hairline gaps the
    proof strip uses. Design-system colours only: ink ground, paper marks, inverted
    under prefers-color-scheme: dark so the mark holds on either browser chrome.
  -->
  <style>
    .ground { fill: #161A1D; }
    .mark { fill: #FBFBF9; }
    @media (prefers-color-scheme: dark) {
      .ground { fill: #E7E9E5; }
      .mark { fill: #121416; }
    }
  </style>
  <rect class="ground" width="32" height="32" />
  <g class="mark">
    <rect x="6" y="19" width="4" height="7" />
    <rect x="14" y="13" width="4" height="13" />
    <rect x="22" y="6" width="4" height="20" />
  </g>
</svg>
