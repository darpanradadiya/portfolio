name: Check outbound links

# Was "Refresh coding stats". It fetched GitHub and LeetCode figures into
# data/stats.json and committed them daily. No coding-profile figure renders
# anywhere on the site now, so the pipeline was writing data nothing read into a
# public repository on a schedule.
#
# One purpose survived: link health. The old job already queried Codeforces
# purely to confirm the handle resolved, because the rating was never rendered.
# This job does that for every URL in the JSON-LD sameAs and every repository row
# on /projects. It writes nothing and needs no credentials, so it needs no write
# permission and no commit step either.

on:
  schedule:
    # Daily, a little after midnight UTC.
    - cron: '17 0 * * *'
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: check-links
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  links:
    name: Resolve every outbound URL
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      # A dead sameAs URL breaks entity resolution without anything looking
      # wrong, and a dead repository row 404s for every visitor. Either is worth
      # a red build.
      - run: npm run check-links
