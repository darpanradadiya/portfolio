name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# A newer push to the same branch makes an in-flight run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Reads .node-version, so CI and local development cannot drift.
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Lint styles
        run: npm run lint:css

      # Fails if a string rendered in the monospace class uses a glyph outside the
      # subset font. See DESIGN.md, "The monospace face is subset to numeric glyphs".
      - name: Check monospace subset
        run: npm run lint:mono

      - name: Check formatting
        run: npm run format:check

      - name: Unit tests
        # Covers the snapshot merge rule (a fetch must never replace good data with
        # worse), the monospace subset, the contact schema, and the rate limiter.
        run: npm run test

      - name: Build
        run: npm run build

      # Scans the build output, so it has to follow the build. Catches an
      # unfinished note or an em-dash in rendered HTML or in an RSC payload —
      # the payload being where the first leak actually was.
      - name: Check rendered output for TODO and em-dashes
        run: npm run lint:todo

      - name: Verify committed fonts
        # Checks glyph coverage rather than byte equality: woff2 output is not
        # reproducible across fontTools and brotli versions, so a byte comparison
        # would fail for reasons unrelated to correctness. What matters is that the
        # monospace font contains exactly MONO_SUBSET and the text font covers
        # everything the site renders.
        run: |
          python3 -m pip install --quiet fonttools brotli
          npm run lint:fonts

  e2e:
    name: End-to-end smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke tests
        # Runs against the production build at desktop and at 320px: every route
        # 200s, logs no console errors, and does not scroll horizontally.
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
